<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Tech da Laiane</title>
  <style>
    /* ===== RESET BÁSICO ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f5f7fa;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    /* ===== CONTEÚDO PRINCIPAL ===== */
    main {
      max-width: 800px;
      width: 100%;
      background-color: #ffffff;
      color: #183C63;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      padding: 32px 24px;
    }

    /* ===== CABEÇALHO ===== */
    header {
      background-color: #183C63;
      color: #ffffff;
      text-align: center;
      padding: 24px 16px;
      border-radius: 12px;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-top: 6px;
    }

    /* ===== ARTIGO ===== */
    article {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      border-bottom: 2px solid #e9edf3;
      padding-bottom: 32px;
      margin-bottom: 16px;
    }

    article img {
      width: 120px;
      height: auto;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .artigo-conteudo {
      flex: 1;
    }

    .artigo-conteudo h2 {
      font-size: 1.6rem;
      margin-bottom: 6px;
    }

    .artigo-autor {
      font-weight: 600;
      color: #4a6a8b;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .artigo-conteudo p {
      line-height: 1.6;
      margin-bottom: 16px;
    }

    /* ===== BOTÕES ===== */
    .botoes-acoes {
      display: flex;
      gap: 16px;
    }

    button {
      background-color: #f0f4fa;
      border: none;
      border-radius: 30px;
      padding: 8px 20px;
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
      color: #183C63;
      font-weight: 500;
    }

    button:hover {
      background-color: #dce4ef;
    }

    button:active {
      transform: scale(0.96);
    }

    button span {
      min-width: 20px;
      text-align: center;
      font-weight: 600;
    }

    /* ===== RODAPÉ (opcional) ===== */
    footer {
      margin-top: 24px;
      text-align: center;
      color: #7a8fa3;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <main>

    <!-- CABEÇALHO -->
    <header>
      <h1>📘 Meu blog tech</h1>
      <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </header>

    <!-- ARTIGO -->
    <article>
      <img 
        src="imagem-blog.png" 
        alt="Logotipo conceitual de tecnologia e educação: um livro aberto de onde emerge um cérebro digital brilhante, cercado por ícones de Wi‑Fi, circuitos e lâmpada de ideia. Cores em tons de azul e branco."
      >
      <div class="artigo-conteudo">
        <h2>Meu primeiro post</h2>
        <p class="artigo-autor">Por: Laiane Paiz Maier</p>
        <p>
          Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação 
          e curiosidades da área de tecnologia.
        </p>

        <!-- BOTÕES DE CURTIR -->
        <div class="botoes-acoes">
          <button data-tipo="coracao">❤️ <span>0</span></button>
          <button data-tipo="joinha">👍 <span>0</span></button>
        </div>
      </div>
    </article>

    <!-- RODAPÉ (opcional) -->
    <footer>
      <p>© 2026 – Blog Tech da Laiane</p>
    </footer>

  </main>

  <script>
    // ============================================
    // CÓDIGO JAVASCRIPT CORRIGIDO E OTIMIZADO
    // ============================================

    // Seleciona todos os botões da página
    const botoes = document.querySelectorAll('.botoes-acoes button');

    // Para cada botão, adiciona o evento de clique
    botoes.forEach(function(botao) {
      // Armazena o estado de "curtiu" diretamente no elemento
      botao.dataset.curtiu = 'false';

      botao.addEventListener('click', function(event) {
        // Impede que o clique se propague (caso haja outros eventos)
        event.stopPropagation();

        // Obtém o elemento <span> dentro do botão
        const span = botao.querySelector('span');
        // Recupera o estado atual (string 'true' ou 'false')
        let curtiu = botao.dataset.curtiu === 'true';

        // Incrementa ou decrementa o contador
        if (!curtiu) {
          span.textContent = parseInt(span.textContent) + 1;
          botao.dataset.curtiu = 'true';
        } else {
          span.textContent = parseInt(span.textContent) - 1;
          botao.dataset.curtiu = 'false';
        }

        // (Opcional) feedback visual: mudar cor do botão
        if (botao.dataset.curtiu === 'true') {
          botao.style.backgroundColor = '#c7d9e8';
        } else {
          botao.style.backgroundColor = '#f0f4fa';
        }
      });
    });
  </script>

</body>
</html>
